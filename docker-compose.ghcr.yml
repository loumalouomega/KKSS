# Run the published KKSS image — no checkout, no submodules, no build:
#   docker compose -f docker-compose.ghcr.yml up -d
#   → http://localhost:6080/
#
# Identical to docker-compose.yml except that it pulls instead of building.
# Images are published for linux/amd64 and linux/arm64 on every release; set
# KKSS_TAG to pin a version (e.g. KKSS_TAG=1.2.0) instead of tracking latest.
services:
  kkss:
    image: "ghcr.io/loumalouomega/kkss:${KKSS_TAG:-latest}"
    ports:
      - "127.0.0.1:${KKSS_PORT:-6080}:6080" # noVNC — open http://localhost:6080/
    shm_size: "1gb" # belt-and-braces alongside --disable-dev-shm-usage
    restart: on-failure
    stop_grace_period: 40s
    depends_on:
      files:
        condition: service_started
    environment:
      KKSS_FILES_URL: http://files:8080
      KKSS_PUBLIC_URL: "${KKSS_PUBLIC_URL:-http://localhost:6080}"
      KKSS_BASE_PATH: "${KKSS_BASE_PATH:-}"
      KKSS_IDLE_TIMEOUT: "${KKSS_IDLE_TIMEOUT:-0}"
      KKSS_AUTH_USERS: "${KKSS_AUTH_USERS:-}"
      KKSS_LLM_PROVIDER: "${KKSS_LLM_PROVIDER:-}"
      KKSS_LLM_MODEL: "${KKSS_LLM_MODEL:-}"
      KKSS_LLM_BASE_URL: "${KKSS_LLM_BASE_URL:-}"
      KKSS_RESTORE_SESSION: "${KKSS_RESTORE_SESSION:-}"
      KKSS_THEME: "${KKSS_THEME:-}"
      KKSS_ZOOM: "${KKSS_ZOOM:-}"
      KKSS_META_ENABLED: "${KKSS_META_ENABLED:-}"
      KKSS_META_PORT: "${KKSS_META_PORT:-}"
      DISPLAY_SIZE: "${KKSS_DISPLAY_SIZE:-1920x1080}"
      # Prefer a mounted KKSS_AUTH_USERS_FILE for operator-provisioned bcrypt accounts.
      # OPEN_FILE: /workspace/model.mdpa # optional file to open at launch
    volumes:
      # There is no repo here, so this defaults to a named volume. Compose's
      # short syntax switches on the leading "/", so the same line takes an
      # absolute host path: KKSS_WORKSPACE=/path/to/your/simulations
      - "${KKSS_WORKSPACE:-kkss-workspace}:/workspace"
      - kkss-userdata:/home/kkss/.config/kkss
  files:
    image: filebrowser/filebrowser:v2.63.23
    command:
      - --database
      - /database/filebrowser.db
      - --root
      - /srv
      - --address
      - 0.0.0.0
      - --port
      - "8080"
      - --baseURL
      - ${KKSS_BASE_PATH:-}/files
      - --auth.method
      - proxy
      - --auth.header
      - X-Remote-User
      - --disableExec
      - "true"
      - --followExternalSymlinks
      - "false"
      - --perm.execute
      - "false"
      - --perm.share
      - "false"
      - --perm.admin
      - "false"
    environment:
      KKSS_BASE_PATH: "${KKSS_BASE_PATH:-}"
    volumes:
      - "${KKSS_WORKSPACE:-kkss-workspace}:/srv"
      - kkss-files:/database
    restart: on-failure

volumes:
  kkss-files:
  kkss-workspace:
  kkss-userdata:
