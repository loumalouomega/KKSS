<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; style-src kkss:; script-src kkss:; img-src kkss: data:" />
  <link href="../theme/vscode-vars.css" rel="stylesheet" />
  <link href="../theme/kkss-ui.css" rel="stylesheet" />
  <link href="./about.css" rel="stylesheet" />
  <title data-i18n="About KKSS">About KKSS</title>
</head>
<body>
  <div id="about">
    <img id="logo" src="../../icon.png" alt="" />
    <h1 id="title" data-i18n="KKSS">KKSS</h1>
    <p id="subtitle" data-i18n="Keep Kratos Simple Stupid">Keep Kratos Simple Stupid</p>
    <dl id="facts">
      <dt data-i18n="Version">Version</dt><dd id="version">…</dd>
      <dt data-i18n="Author">Author</dt><dd id="author">…</dd>
    </dl>
    <div id="update">
      <span id="update-spinner" class="spinner" hidden></span>
      <span id="update-text" data-i18n="Checking for updates…">Checking for updates…</span>
      <progress id="update-progress" aria-label="Update progress" data-i18n-aria-label="Update progress" max="100" value="0" hidden></progress>
      <div id="update-actions"></div>
    </div>
    <div id="footer">
      <button id="docs-btn" class="btn btn-secondary" data-i18n="Documentation">Documentation</button>
      <button id="close-btn" class="btn btn-secondary" data-i18n="Close">Close</button>
    </div>
  </div>
  <script src="./about.js"></script>
</body>
</html>
