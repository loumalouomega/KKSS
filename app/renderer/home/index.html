<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; style-src kkss:; script-src kkss:; img-src kkss: data:" />
  <link href="../theme/vscode-vars.css" rel="stylesheet" />
  <link href="./home.css" rel="stylesheet" />
  <title>KKSS Home</title>
</head>
<body>
  <div id="home">
    <img id="logo" src="../../icon.png" alt="" />
    <h1 id="title">KKSS</h1>
    <p id="subtitle">Keep Kratos Simple Stupid</p>
    <div id="menu" role="menu" aria-label="Main menu"></div>
    <!-- Both sections are populated from main over home:toWebview and stay
         hidden until there is something to show, so a fresh install looks
         exactly as it always has. -->
    <section id="project-root" hidden>
      <div id="project-root-head">
        <h2 id="project-root-title">Project root</h2>
        <span id="project-root-actions">
          <button id="project-root-change" type="button">Change</button>
          <button id="project-root-clear" type="button" title="Go back to using the open document's folder">Clear</button>
        </span>
      </div>
      <div id="project-root-path"></div>
    </section>
    <section id="recents" hidden>
      <div id="recents-head">
        <h2 id="recents-title">Recent files</h2>
        <button id="recents-clear" type="button" title="Forget every remembered file">Clear</button>
      </div>
      <div id="recents-list" role="menu" aria-label="Recent files"></div>
    </section>
  </div>
  <script src="./home.js"></script>
</body>
</html>
