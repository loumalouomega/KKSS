<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; style-src kkss:; script-src kkss:; img-src kkss: data:" />
  <link href="../theme/vscode-vars.css" rel="stylesheet" />
  <link href="../theme/kkss-ui.css" rel="stylesheet" />
  <link href="./license.css" rel="stylesheet" />
  <title data-i18n="KKSS License">KKSS License</title>
</head>
<body>
  <div id="license">
    <img id="logo" src="../../icon.png" alt="" />
    <h1 id="title" data-i18n="KKSS License">KKSS License</h1>
    <p id="subtitle" data-i18n="Full license text, as shipped with this build (version {0}).">Full license text, as shipped with this build (version {0}).</p>
    <pre id="license-text" aria-label="License text">…</pre>
    <div id="footer">
      <button id="close-btn" class="btn btn-secondary" data-i18n="Close">Close</button>
    </div>
  </div>
  <script src="./license.js"></script>
</body>
</html>
