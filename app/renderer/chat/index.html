<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; style-src kkss:; script-src kkss:; img-src kkss: data:" />
  <link href="../theme/vscode-vars.css" rel="stylesheet" />
  <link href="../theme/kkss-ui.css" rel="stylesheet" />
  <link href="./chat.css" rel="stylesheet" />
  <title data-i18n="KKSS AI Chat">KKSS AI Chat</title>
</head>
<body>
  <div id="chat">
    <header id="chat-header" class="section-header">
      <span class="panel-icon" id="chat-icon"></span>
      <span id="chat-title" class="title" title="AI assistant" data-i18n-title="AI assistant" data-i18n="AI Chat">AI Chat</span>
      <span id="servers" title="MCP tool servers" data-i18n-title="MCP tool servers"></span>
      <span id="usage" class="ui-num" hidden></span>
      <button id="mcp-btn" aria-controls="mcp-panel" aria-expanded="false" class="icon-btn" title="Assistant extensions: MCP servers, instructions, skills" data-i18n-title="Assistant extensions: MCP servers, instructions, skills" aria-label="Assistant extensions" data-i18n-aria-label="Assistant extensions"></button>
      <button id="history-btn" aria-controls="history" aria-expanded="false" class="icon-btn" title="Conversations" data-i18n-title="Conversations" aria-label="Conversations" data-i18n-aria-label="Conversations"></button>
      <button id="new-btn" class="icon-btn" title="Start a new conversation (this one is saved)" data-i18n-title="Start a new conversation (this one is saved)" aria-label="New conversation" data-i18n-aria-label="New conversation"></button>
      <button id="hide-btn" class="icon-btn" title="Hide chat (Ctrl+Shift+L)" data-i18n-title="Hide chat (Ctrl+Shift+L)" aria-label="Hide chat" data-i18n-aria-label="Hide chat"></button>
      <div id="history" class="card card-float" hidden></div>
    </header>
    <section id="mcp-panel" role="region" aria-label="Assistant extensions" data-i18n-aria-label="Assistant extensions" hidden>
      <div class="mcp-head">
        <span class="title" data-i18n="Assistant extensions">Assistant extensions</span>
        <button id="mcp-close" class="icon-btn" title="Close" data-i18n-title="Close" aria-label="Close" data-i18n-aria-label="Close"></button>
      </div>
      <div id="mcp-body"></div>
    </section>
    <section id="kratos-status" role="status" aria-live="polite" hidden></section>
    <div id="compaction" hidden></div>
    <div id="messages" role="region" aria-label="Conversation" data-i18n-aria-label="Conversation" tabindex="0"></div>
    <div id="announcement" class="sr-only" role="status" aria-live="polite"></div>
    <div id="attachments" hidden>
      <div id="attach-notice" role="status" aria-live="polite" hidden></div>
      <div id="attach-list"></div>
    </div>
    <div id="composer-options" hidden>
      <span id="model-icon" class="opt-icon" aria-hidden="true"></span>
      <select id="model-select" class="field" title="Model for the next message" data-i18n-title="Model for the next message" aria-label="Model" data-i18n-aria-label="Model"></select>
      <input id="model-input" class="field" type="text" maxlength="200" spellcheck="false" hidden
        placeholder="Model id" data-i18n-placeholder="Model id" aria-label="Model id" data-i18n-aria-label="Model id" />
      <span id="think-icon" class="opt-icon" aria-hidden="true"></span>
      <select id="think-select" class="field" title="Thinking effort for the next message" data-i18n-title="Thinking effort for the next message" aria-label="Thinking effort" data-i18n-aria-label="Thinking effort"></select>
    </div>
    <div id="template-hints" role="listbox" aria-label="Prompt templates" data-i18n-aria-label="Prompt templates" hidden></div>
    <footer id="composer">
      <textarea id="input" aria-label="Message to the assistant" data-i18n-aria-label="Message to the assistant" class="field" rows="3"
        placeholder="Ask about the open model, meshing, or running Kratos… (Enter to send, Shift+Enter for a new line)" data-i18n-placeholder="Ask about the open model, meshing, or running Kratos… (Enter to send, Shift+Enter for a new line)"></textarea>
      <input id="file-input" type="file" multiple hidden accept="image/png,image/jpeg,image/webp,image/gif,application/pdf" />
      <button id="attach-btn" class="icon-btn" title="Attach images or PDFs" data-i18n-title="Attach images or PDFs" aria-label="Attach images or PDFs" data-i18n-aria-label="Attach images or PDFs"></button>
      <button id="send-btn" aria-label="Send message" data-i18n-aria-label="Send message" class="btn btn-primary" title="Send (Enter)" data-i18n-title="Send (Enter)"></button>
    </footer>
  </div>
  <script src="./chat.js"></script>
</body>
</html>
