name: Release

# Tag-driven release, following the mesh submodule's convention: every
# v*.*.* tag builds installers for the three platforms and attaches them to a
# GitHub Release (prerelease when the tag contains a hyphen).
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

# Targets: Linux x64 + arm64, Windows x64 + arm64, macOS arm64 — one runner
# per OS/arch. node-pty (the embedded terminal's native module) is why the
# matrix is per-arch: on Linux it compiles from source during npm ci (no
# prebuilds), and on Windows its install step assembles the arch-specific
# ConPTY binaries — both must run on hardware matching the target arch.
# It is N-API, so no Electron-ABI rebuild step is needed.
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            args: --linux --x64
          - os: ubuntu-24.04-arm
            args: --linux --arm64
            # electron-builder's fpm (used for the .deb target) only ships a
            # bundled linux-x86 binary — it fails with "Exec format error" on
            # an arm64 host. Install a system fpm via gem and point
            # electron-builder at it (see the Package installers step below).
            system_fpm: true
          - os: windows-latest
            args: --win --x64
          - os: windows-11-arm
            args: --win --arm64
          - os: macos-latest
            args: --mac --arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            cad/package-lock.json
            mesh/package-lock.json

      - run: npm ci

      - name: Install submodule dependencies
        run: npm run submodules:install

      - name: Build (submodules + app)
        run: npm run build

      - name: Clean release directory
        shell: bash
        run: rm -rf release

      - name: Check optional macOS signing inputs
        if: matrix.os == 'macos-latest'
        env:
          MACOS_SIGNING_ENABLED: ${{ secrets.MACOS_SIGNING_ENABLED }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          if [ "$MACOS_SIGNING_ENABLED" = 1 ]; then
            test -n "$CSC_LINK" -a -n "$CSC_KEY_PASSWORD" \
              || { echo 'MACOS_SIGNING_ENABLED requires a Developer ID certificate and password'; exit 1; }
            if [ -z "$APPLE_ID" ] || [ -z "$APPLE_TEAM_ID" ] || [ -z "$APPLE_APP_SPECIFIC_PASSWORD" ]; then
              test -n "$APPLE_API_KEY" -a -n "$APPLE_API_KEY_ID" -a -n "$APPLE_API_ISSUER" \
                || { echo 'MACOS_SIGNING_ENABLED requires Apple ID credentials or an App Store Connect API key'; exit 1; }
            fi
          fi

      - name: Install system fpm
        if: matrix.system_fpm
        run: |
          sudo apt-get update
          sudo apt-get install -y ruby ruby-dev build-essential
          sudo gem install --no-document fpm

      - name: Mark signed macOS package
        if: matrix.os == 'macos-latest'
        env:
          MACOS_SIGNING_ENABLED: ${{ secrets.MACOS_SIGNING_ENABLED }}
        run: |
          if [ "$MACOS_SIGNING_ENABLED" = 1 ]; then
            node -e 'const fs=require("fs"); const p=JSON.parse(fs.readFileSync("package.json","utf8")); p.kkssSignedRelease=true; fs.writeFileSync("package.json", JSON.stringify(p,null,2)+"\\n")'
          fi

      - name: Package installers
        # electron-builder/builder-util auto-enables hard-link copying on CI
        # (isCI check in builder-util/src/fs.ts); a duplicate internal write
        # to the same destination throws EEXIST under hard-link semantics but
        # silently succeeds under plain copy, which is why this only
        # reproduces here and never locally. USE_HARD_LINKS=false is the
        # maintainer-endorsed toggle (electron-userland/electron-builder#7093).
        # USE_SYSTEM_FPM makes getFpmPath() use the gem-installed fpm above
        # instead of the bundled linux-x86 binary. Still supported on our
        # electron-builder ^26, but removed in v27+ — re-evaluate this flag
        # before any future v27 bump.
        env:
          USE_HARD_LINKS: 'false'
          USE_SYSTEM_FPM: ${{ matrix.system_fpm && 'true' || 'false' }}
          MACOS_SIGNING_ENABLED: ${{ secrets.MACOS_SIGNING_ENABLED }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: npx electron-builder ${{ matrix.args }} --publish never

      - name: Validate macOS signing configuration
        if: matrix.os == 'macos-latest'
        env:
          MACOS_SIGNING_ENABLED: ${{ secrets.MACOS_SIGNING_ENABLED }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          if [ "$MACOS_SIGNING_ENABLED" = 1 ]; then
            test -n "$APPLE_ID" -a -n "$APPLE_TEAM_ID" -a -n "$APPLE_APP_SPECIFIC_PASSWORD" \
              || { echo 'MACOS_SIGNING_ENABLED requires Apple notarization credentials'; exit 1; }
            xcrun stapler validate release/*.dmg
          else
            echo 'MACOS_SIGNING_ENABLED is not set; retaining unsigned macOS artifacts'
          fi

      # Channel yml files + *.blockmap are electron-updater's update feed —
      # the packaged app checks them on the GitHub Release (About ▸ Update
      # now). Names never collide across platforms, so merge-multiple is safe.
      - uses: actions/upload-artifact@v7
        with:
          name: kkss-${{ matrix.os }}
          path: |
            release/*.AppImage
            release/*.deb
            release/*.rpm
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.yml
            release/*.blockmap
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/**
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
