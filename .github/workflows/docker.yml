# Proves the streamed-desktop Docker image builds and boots — noVNC answers,
# the X display is up and the app process is alive — on both architectures, and
# on v*.*.* tags publishes a multi-arch manifest to GHCR and Docker Hub.
#
# One job per architecture on its OWN native runner. The usual multi-arch
# shortcut (build once with --platform=$BUILDPLATFORM) does not apply here:
# the image ships a packaged Electron app, i.e. a per-arch native binary, and
# QEMU is impractical because the in-image build compiles node-pty and runs the
# full submodule build. Each job pushes by digest; `manifest` merges them.
#
# Docker Hub needs the DOCKERHUB_USERNAME / DOCKERHUB_TOKEN secrets; GHCR uses
# the built-in GITHUB_TOKEN. Branch pushes and PRs stay build-only.
name: Docker

on:
  push:
    branches: [master]
    # paths filters are ignored for tag pushes, so tags always run.
    tags: ["v*.*.*"]
    paths:
      - "docker/**"
      - "docker-compose*.yml"
      - ".dockerignore"
      - "electron-builder.yml"
      - "package*.json"
      - "app/**"
      - ".github/workflows/docker.yml"
  pull_request:
    paths:
      - "docker/**"
      - "docker-compose*.yml"
      - ".dockerignore"
      - "electron-builder.yml"
      - "package*.json"
      - "app/**"
      - ".github/workflows/docker.yml"

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  # GHCR requires a lowercase path; github.repository is mixed case.
  GHCR_IMAGE: ghcr.io/loumalouomega/kkss
  DOCKERHUB_IMAGE: vmataix/kkss

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: hadolint/hadolint-action@v3.3.0
        with:
          dockerfile: docker/Dockerfile
          # Pinning every apt package version is impractical for a base we
          # rebuild on every release; the rest of the ruleset still applies.
          ignore: DL3008

  image:
    name: image (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: amd64
          - os: ubuntu-24.04-arm
            arch: arm64
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: docker/setup-buildx-action@v4

      # Build once, locally, and boot-check it before anything is published.
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          push: false
          load: true
          tags: kkss-web:ci
          # Per-arch scope: one shared scope would have the two runners
          # evicting each other's layers.
          cache-from: type=gha,scope=docker-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=docker-${{ matrix.arch }}

      - name: Boot container and healthcheck
        run: |
          # Whatever fails below, show the container's own account of it —
          # without this the log ends at a bare "exit code 1" and says nothing.
          diagnose() {
            echo "::group::container state"
            docker ps -a --filter name=kkss --format '{{.Status}} — {{.Image}}'
            docker inspect --format 'running={{.State.Running}} exit={{.State.ExitCode}} oom={{.State.OOMKilled}}' kkss || true
            echo "::endgroup::"
            echo "::group::container logs"
            docker logs kkss 2>&1 | tail -100 || true
            echo "::endgroup::"
          }
          trap diagnose EXIT

          docker run -d --name kkss --shm-size=1g -p 6080:6080 kkss-web:ci
          ok=0
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:6080/ >/dev/null; then ok=1; break; fi
            # An exited container will never answer — fail fast instead of
            # burning the full two minutes on a corpse.
            if [ "$(docker inspect --format '{{.State.Running}}' kkss)" != "true" ]; then
              echo "container exited before noVNC came up" >&2
              exit 1
            fi
            sleep 2
          done
          [ "$ok" = "1" ]
          curl -fsS http://localhost:6080/vnc.html >/dev/null
          # The same three signals the image's own HEALTHCHECK asserts
          # (rendering itself is covered by the smoke test in ci.yml).
          docker exec kkss xdpyinfo -display :99 >/dev/null
          docker exec kkss pgrep -f /opt/kkss/kkss >/dev/null
          # The image must run unprivileged and must not carry the build stage.
          test "$(docker exec kkss id -u)" = "1000"
          if docker exec kkss sh -c 'command -v npm' >/dev/null 2>&1; then
            echo "npm is present in the runtime stage — the build stage leaked" >&2
            exit 1
          fi
          # (`node` IS present: Debian's novnc package depends on nodejs. That
          # is a runtime dependency of the streaming stack, not a leak.)
          if docker exec kkss test -e /kkss; then
            echo "/kkss exists — the source tree leaked into the runtime stage" >&2
            exit 1
          fi

      - name: Stop cleanly (the entrypoint must forward SIGTERM)
        run: |
          start=$(date +%s)
          docker stop kkss >/dev/null
          elapsed=$(( $(date +%s) - start ))
          echo "docker stop took ${elapsed}s"
          # A container that ignores SIGTERM is SIGKILLed at the 10s timeout.
          [ "$elapsed" -lt 10 ]

      - name: Scan for vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: kkss-web:ci
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          # Report on PRs/branches; only a release is gated on a clean scan.
          exit-code: ${{ github.ref_type == 'tag' && '1' || '0' }}

      # ---- publish (release tags only, after the checks above) ----
      - name: Log in to GHCR
        if: github.ref_type == 'tag'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: github.ref_type == 'tag'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Push by digest only — no per-arch tags land in the registries; the
      # `manifest` job below combines the digests into one multi-arch tag.
      - name: Push by digest
        if: github.ref_type == 'tag'
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          # Fully cached by the build step above — this re-tags and pushes,
          # it does not rebuild.
          cache-from: type=gha,scope=docker-${{ matrix.arch }}
          # ONE image exporter carrying BOTH names — not two exporters. Two
          # separate `type=image` outputs do push to both registries, but each
          # push gets its own provenance attestation naming that registry, so
          # the two manifest indexes hash differently and the single reported
          # `digest` output is only valid for the LAST one. The `manifest` job
          # then can't resolve it in the other registry ("not found"). Quoting
          # `"name=a,b"` keeps the comma inside the value.
          outputs: 'type=image,"name=${{ env.GHCR_IMAGE }},${{ env.DOCKERHUB_IMAGE }}",push-by-digest=true,name-canonical=true,push=true'

      - name: Export the digest
        if: github.ref_type == 'tag'
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${{ matrix.arch }}-${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.push.outputs.digest }}

      - uses: actions/upload-artifact@v4
        if: github.ref_type == 'tag'
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          retention-days: 1

      - name: Cleanup
        if: always()
        run: docker rm -f kkss || true

  manifest:
    needs: image
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ env.GHCR_IMAGE }}
            ${{ env.DOCKERHUB_IMAGE }}
          # latest=auto (default) skips `latest` for hyphenated prereleases,
          # matching release.yml's prerelease convention.
          tags: |
            type=semver,pattern={{version}}

      # One manifest list per image name, assembled from the per-arch digests.
      - name: Create and push the manifest lists
        working-directory: /tmp/digests
        # META_JSON goes through the environment, not string interpolation into
        # the script — a quote in the JSON would otherwise break the shell.
        env:
          META_JSON: ${{ steps.meta.outputs.json }}
        run: |
          # Digest artifacts are named "<arch>-<hex>"; recover the refs.
          digests=$(printf '%s\n' * | sed 's/^[^-]*-/@sha256:/')
          for image in "$GHCR_IMAGE" "$DOCKERHUB_IMAGE"; do
            tags=$(jq -r --arg img "$image" \
              '.tags | map(select(startswith($img + ":"))) | map("-t " + .) | join(" ")' \
              <<< "$META_JSON")
            # shellcheck disable=SC2086 — both lists must word-split.
            docker buildx imagetools create $tags $(printf "${image}%s " $digests)
          done

      - name: Verify both architectures are present
        run: |
          for image in "${{ env.GHCR_IMAGE }}" "${{ env.DOCKERHUB_IMAGE }}"; do
            ref="${image}:${{ steps.meta.outputs.version }}"
            docker buildx imagetools inspect "$ref"
            docker buildx imagetools inspect "$ref" --format '{{json .Manifest}}' \
              | jq -e '[.manifests[].platform | select(.os == "linux") | .architecture] | (index("amd64") and index("arm64"))'
          done
